name: 'marketing_dbt'
version: '1.0.0'
profile: 'marketing_dbt'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# Required by Elementary on dbt >= 1.8
flags:
  require_explicit_package_overrides_for_builtin_materializations: false
  source_freshness_run_project_hooks: true

models:
  marketing_dbt:
    # Staging: 1:1 with raw tables, light cleaning only -> views (cheap, always fresh, no storage).
    staging:
      +schema: staging
      +materialized: view
    # Intermediate: reusable join/union logic, read only by marts.
    # Platform-specific models are ephemeral (see model configs); the union is a view.
    intermediate:
      +schema: intermediate
      +materialized: view
    # Marts: what analysts, BI tools and AI agents query -> persisted for fast reads.
    marts:
      +schema: marts
      +materialized: table
  elementary:
    +schema: elementary

seeds:
  marketing_dbt:
    +schema: reference
