version: 2

seeds:
  - name: currency_rates_to_eur
    config:
      column_types:
        currency_code: string
        rate_to_eur: decimal(18, 6)
        rate_basis: string
    description: >
      Static conversion rates used to report all spend in one currency (EUR).
      A single annual-average rate is a deliberate simplification for v1; a daily
      FX feed would replace this seed in a later version.
    columns:
      - name: currency_code
        description: ISO currency code.
        data_tests: [unique, not_null]
      - name: rate_to_eur
        description: Multiply an amount in currency_code by this to get EUR.
        data_tests: [not_null]
